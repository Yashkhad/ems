services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ems_postgres
    environment:
      POSTGRES_USER: ems_admin
      POSTGRES_PASSWORD: EMS@2024Secure
      POSTGRES_DB: ems_attendance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - ems_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ems_admin -d ems_attendance" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ems_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ems.com
      PGADMIN_DEFAULT_PASSWORD: EMS@Admin2024
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - ems_network
    depends_on:
      - postgres

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ems_admin
      DB_PASSWORD: EMS@2024Secure
      DB_NAME: ems_attendance
      JWT_SECRET: EMSLifestyle2024SecretKey@JWT!Secure
      JWT_EXPIRES_IN: 8h
      GOOGLE_SHEETS_ENABLED: "true"
      DATABASE_URL: "postgresql://ems_admin:EMS@2024Secure@postgres:5432/ems_attendance"
      FACE_RECOGNITION_THRESHOLD: "0.5"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - face_data:/app/face_data
    ports:
      - "3000:3000"
    networks:
      - ems_network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npx prisma db seed && node src/server.js"

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - ems_network
    depends_on:
      - backend

networks:
  ems_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  face_data:
